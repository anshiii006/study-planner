<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
    <div class="logo">
        <h2>Study Planner</h2>
    </div>

    <nav class="navbar">
        <a href="#">Dashboard</a>
        <a href="#">Tasks</a>
        <a href="#">Progress</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Plan. Study. Achieve.</h1>
        <p>Organize your study tasks and stay focused on your goals.</p>
    </section>
    <section class="dashboard">

    <h2>Your Study Dashboard</h2>
<div class="dashboard-cards">

    <div class="card">
        <h3>Total Tasks</h3>
        <p id="totalTasks">0</p>
    </div>

    <div class="card">
        <h3>Completed</h3>
        <p id="completedTasks">0</p>
    </div>

    <div class="card">
        <h3>Pending</h3>
        <p id="pendingTasks">0</p>
    </div>

</div>

    </div>

</section>
<section class="add-task">

    <h2>Add Study Task</h2>

    <form id="taskForm">

        <div class="form-group">
            <label for="taskName">Task Name</label>
            <input
                type="text"
                id="taskName"
                placeholder="e.g. Complete DBMS Chapter"
                required
            >
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                placeholder="e.g. DBMS"
                required
            >
        </div>

        <div class="form-group">
            <label for="dueDate">Due Date</label>
            <input
                type="date"
                id="dueDate"
                required
            >
        </div>
        <div class="form-group">
    <label for="priority">Priority</label>

    <select id="priority" required>
        <option value="">Select Priority</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
    </select>
</div>

        <button type="submit">Add Task</button>

    </form>

</section>
</main>

    <script src="script.js"></script>
</body>
</html>
