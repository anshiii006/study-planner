<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
    <div class="logo">
        <h2>Study Planner</h2>
    </div>

    <nav class="navbar">
        <a href="#">Dashboard</a>
        <a href="#">Tasks</a>
        <a href="#">Progress</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Plan. Study. Achieve.</h1>
        <p>Organize your study tasks and stay focused on your goals.</p>
    </section>
    <section class="dashboard">

    <h2>Your Study Dashboard</h2>
<div class="dashboard-cards">

    <div class="card">
        <h3>Total Tasks</h3>
        <p id="totalTasks">0</p>
    </div>

    <div class="card">
        <h3>Completed</h3>
        <p id="completedTasks">0</p>
    </div>

    <div class="card">
        <h3>Pending</h3>
        <p id="pendingTasks">0</p>
    </div>

</div>

    </div>

</section>
</main>

    <script src="script.js"></script>
</body>
</html>
